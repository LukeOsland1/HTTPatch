name: Publish privacy policy

# Enable GitHub Pages on the personal repository before running this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs, as elsewhere in this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # `npm ci` installs from the lockfile, so the renderer this job executes is
      # pinned by hash and covered by `npm audit` and Dependabot. A floating
      # `npm install marked@15` would resolve at build time to whatever 15.x was
      # newest — unpinned code running next to a checkout of this private repo,
      # holding `pages: write` and `id-token: write`. That is the same threat the
      # SHA-pinned actions above defend against.
      - run: npm ci
      - run: npm run build:privacy
      - name: Show exactly what will be published
        run: find _site -type f | sort
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

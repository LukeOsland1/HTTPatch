name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to an immutable commit SHA (not a mutable
      # tag) so a compromised or retagged release can't silently run here;
      # Dependabot (.github/dependabot.yml) keeps the SHAs current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail the build on High/Critical advisories in *shipped* (production)
      # dependencies. Dev-only toolchain advisories (vite/vitest) never reach the
      # packaged extension, so they're reported separately and don't block.
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build:privacy
      - run: npm test
      - run: npm run build
      # Guards the BUILT manifest: no permission drift (an added permission fails the
      # CWS publish) and no web_accessible_resources (fingerprinting surface). Must run
      # after the build, since `npm test` runs before dist/ exists.
      - run: npm run check:manifest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Firefox target: build the isolated dist-firefox/ and lint the manifest
      # so a Gecko regression is caught on PRs. (web-ext lint exits non-zero only
      # on errors, not on the framework innerHTML warnings.)
      - run: npm run build:firefox
      - run: node scripts/check-built-manifest.mjs dist-firefox
      - run: npm run lint:firefox
